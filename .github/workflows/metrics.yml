name: Metrics

on:
  # Refresh the profile card once a day.
  schedule: [{ cron: "0 0 * * *" }]
  # Allow an on-demand refresh from the Actions tab.
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: seanxuu
          filename: github-metrics.svg

          # Keep the profile card readable while adding contribution signals.
          base: header, activity, community

          # Notable contributions from public organization repositories.
          # The filter is GitHub search syntax; only repositories with >500 stars
          # are considered, so the card stays focused on well-known projects.
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_types: commit, pull_request, issue
          plugin_notable_repositories: yes
          plugin_notable_filter: "stars:>500"
          plugin_notable_from: organization

          # Follow-up summarizes the user's issue/PR outcomes across repositories.
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          plugin_followup_indepth: yes

          # Show earned GitHub achievements without inventing project claims.
          plugin_achievements: yes
          plugin_achievements_threshold: B
